name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Android API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36"

      - name: فك ملف المشروع
        run: |
          unzip -q AlMaystro_GitHub_Ready_API36.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: بناء APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMaystro-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
